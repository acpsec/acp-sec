<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACP-SEC — Leaderboard Access</title>
  <link rel="icon" type="image/jpeg" href="/static/logo.jpg?v=5">
  <link rel="apple-touch-icon" href="/static/logo.jpg?v=5">
  <meta name="theme-color" content="#0052FF">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary:    #0A0B0D;
      --bg-secondary:  #1C1D1F;
      --bg-tertiary:   #2A2B2E;
      --text-primary:  #FFFFFF;
      --text-secondary:#8A919E;
      --text-tertiary: #6B7280;
      --border:        #2A2B2E;
      --border-light:  #1C1D1F;
      --accent-base:   #0052FF;
      --accent-success:#00C087;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ─────────────────────────────────────────────────────────────── */
    .acpsec-nav {
      display: flex; align-items: center; gap: 4px;
      height: 48px; padding: 0 20px;
      background: #0A0B0D;
      border-bottom: 1px solid #1C1D1F;
      font: 13px/1 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .acpsec-nav__brand {
      display: inline-flex; align-items: center; gap: 6px;
      margin-right: 16px; font-weight: 700;
      color: #0052FF; text-decoration: none; letter-spacing: -.01em;
      font-size: 14px;
    }
    .acpsec-nav__brand img {
      width: 22px; height: 22px; border-radius: 4px; object-fit: cover;
    }
    .acpsec-nav__links { display: flex; gap: 2px; flex: 1; }
    .acpsec-nav__link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 6px; text-decoration: none;
      color: #8A919E; font-weight: 500;
      transition: background .15s, color .15s;
    }
    .acpsec-nav__link:hover { background: rgba(255,255,255,.06); color: #fff; }
    @media (max-width: 540px) {
      .acpsec-nav { padding: 0 12px; }
      .acpsec-nav__link span:not(.acpsec-nav__icon) { display: none; }
    }

    /* ── Main content ────────────────────────────────────────────────────────── */
    .page-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Login card ──────────────────────────────────────────────────────────── */
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .login-logo img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
    }
    .login-logo-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-base);
      letter-spacing: -.01em;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.4rem;
      letter-spacing: -.02em;
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .login-input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .login-input:focus {
      border-color: var(--accent-base);
    }
    .login-input::placeholder {
      color: var(--text-tertiary);
    }

    .login-btn {
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--accent-base);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .login-btn:hover { opacity: .88; }
    .login-btn:active { transform: scale(.98); }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }

    .login-error {
      display: none;
      margin-top: 0.25rem;
      padding: 0.55rem 0.8rem;
      background: rgba(255, 68, 68, .12);
      border: 1px solid rgba(255, 68, 68, .3);
      border-radius: 7px;
      color: #FF6B6B;
      font-size: 0.85rem;
      text-align: center;
    }
    .login-error.visible { display: block; }
  </style>
</head>
<body>

  <!-- ── Navbar ────────────────────────────────────────────────────────────── -->
  <nav class="acpsec-nav">
    <a class="acpsec-nav__brand" href="/">
      <img src="/static/logo.jpg?v=5" alt="ACP-SEC logo">
      ACP-SEC
    </a>
    <div class="acpsec-nav__links">
      <a class="acpsec-nav__link" href="/">
        <span class="acpsec-nav__icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a class="acpsec-nav__link" href="/scanner">
        <span class="acpsec-nav__icon">🔍</span>
        <span>Scanner</span>
      </a>
      <a class="acpsec-nav__link" href="/leaderboard">
        <span class="acpsec-nav__icon">🏆</span>
        <span>Leaderboard</span>
      </a>
    </div>
  </nav>

  <!-- ── Login card ────────────────────────────────────────────────────────── -->
  <div class="page-body">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/logo.jpg?v=5" alt="ACP-SEC">
        <span class="login-logo-name">ACP-SEC</span>
      </div>

      <h1 class="login-title">Leaderboard Access</h1>
      <p class="login-subtitle">This leaderboard is restricted.</p>

      <div class="login-form">
        <input
          type="password"
          id="pwd"
          class="login-input"
          placeholder="Enter password"
          autocomplete="current-password"
          autofocus
        >
        <button id="submit-btn" class="login-btn">Access Leaderboard</button>
        <div id="error-msg" class="login-error"></div>
      </div>
    </div>
  </div>

  <script>
    const pwdInput  = document.getElementById('pwd');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg  = document.getElementById('error-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function clearError() {
      errorMsg.classList.remove('visible');
    }

    async function attemptLogin() {
      const password = pwdInput.value;
      if (!password) {
        showError('Please enter a password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying…';
      clearError();

      try {
        const res = await fetch('/api/leaderboard/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          window.location.href = '/leaderboard';
        } else if (res.status === 401) {
          showError('Incorrect password. Please try again.');
          pwdInput.value = '';
          pwdInput.focus();
        } else {
          showError('An unexpected error occurred. Please try again.');
        }
      } catch (err) {
        showError('Network error — check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Access Leaderboard';
      }
    }

    submitBtn.addEventListener('click', attemptLogin);

    pwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });
  </script>
</body>
</html>
