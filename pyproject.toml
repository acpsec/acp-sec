[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acpsec"
version = "0.5.0"
description = "ACP-SEC: AI Agent Communication Protocol Security Assessment Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.scripts]
acpsec = "acpsec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acpsec*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "network: live-RPC integration test — hits public Base RPC. Opt-in only: deselected/skipped by default, run with `-m network` and B20_LIVE_RPC set.",
    "oracle: preflight self-checking oracle — boots anvil + base-std mocks. Skipped by default (needs forge/anvil + the preflight impl), run with `-m oracle`. CI fast lane runs `-m 'not oracle'`.",
]
