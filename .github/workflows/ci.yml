# CI — pytest gate + Docker image secret-leak gate for acp-sec.
#
# Two jobs, no secrets:
#   test          — runs the full test suite on push and PR to main.
#   docker-build  — builds the image and fails if any secret VALUE was baked
#                   into layer history. Graceful no-op until the Dockerfile
#                   lands (#48): when no Dockerfile is present it exits green so
#                   the check can exist in branch protection ahead of the fix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Install from the compiled dev lock (pins base+api+dev to exact
        # versions, matching the prod lock), then the local package without
        # touching deps. Reproducible: no re-resolution from pyproject floors.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Verify the lock is honoured
        # Green must PROVE the pinned versions were installed, not merely that
        # the suite passed — an unhonoured lock otherwise fails silently green.
        # `pip check` validates dependency consistency across the installed env;
        # the assertion fails the build if any prod-lock pin differs from what is
        # actually installed, naming the package and both versions. Proven to
        # bite: overriding a single pin makes this step exit 1.
        run: |
          pip check
          python - <<'PY'
          import importlib.metadata as md, re, sys
          bad = []
          for ln in open("requirements/prod.txt"):
              m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;]+)", ln)
              if not m:
                  continue
              name, want = m.group(1), m.group(2)
              try:
                  got = md.version(name)
              except md.PackageNotFoundError:
                  got = None
              if got != want:
                  bad.append(f"{name}: lock={want} installed={got}")
          if bad:
              print("LOCK NOT HONOURED:\n  " + "\n  ".join(bad))
              sys.exit(1)
          print("prod lock honoured — every pin == installed version")
          PY

      - name: Run test suite
        # -rs surfaces skip reasons in the log. The ONLY expected skips are the
        # two B20 live-RPC tests (skipif-gated on B20_LIVE_RPC, unset here).
        # Do NOT set B20_LIVE_RPC and do NOT pass `-m network` — those hit
        # public Base/Sepolia RPC.
        run: pytest tests/ -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Dockerfile
        # Graceful skip: until #48 lands there is no Dockerfile. Rather than fail,
        # record its absence and let the build/verify steps no-op so this check
        # can be added to branch protection BEFORE the Dockerfile arrives. Once
        # #48 adds a Dockerfile, both steps below activate automatically.
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile present — build + secret-leak verification will run."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet — skipping build cleanly (green)."
          fi

      - name: Build Docker image
        if: steps.check.outputs.exists == 'true'
        run: docker build . -t acpsec-ci-verify

      - name: Verify no secrets baked into image layers
        # Load-bearing check. Fails the build if any secret variable VALUE appears
        # in layer history. Variable NAMES are expected (they appear in CMD/ENV
        # instructions); only VALUES would indicate a secret was leaked via ARG
        # or build-time ENV.
        if: steps.check.outputs.exists == 'true'
        run: |
          if docker history acpsec-ci-verify --no-trunc \
            | grep -iE "SCANNER_TOKEN=[^ ]|LEADERBOARD_PASSWORD=[^ ]|ANTHROPIC_API_KEY=[^ ]|CDP_API_KEY=[^ ]|B20_RPC_URL.*=https"; then
            echo "FAIL: secret values found in Docker layer history"
            exit 1
          fi
          echo "PASS: no secret values in image layers"
