# CI — pytest gate for acp-sec.
#
# Single job, single Python version, no secrets. Runs the full test suite on
# push and PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run test suite
        # -rs surfaces skip reasons in the log. The ONLY expected skips are the
        # two B20 live-RPC tests (skipif-gated on B20_LIVE_RPC, unset here).
        # Do NOT set B20_LIVE_RPC and do NOT pass `-m network` — those hit
        # public Base/Sepolia RPC.
        run: pytest tests/ -rs
